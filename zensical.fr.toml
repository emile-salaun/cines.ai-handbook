# =============================================================================
# cines.ai - Handbook — French site
#   Built into site/fr/, AFTER the English version (zensical.toml),
#   whose build wipes site/.
#   Local preview:  zensical serve -f zensical.fr.toml -a localhost:8001
#   Both files share everything except [project] paths, the language and the
#   UI labels: keep the rest in sync.
# =============================================================================

[project]
site_name = "cines.ai - Handbook"
site_description = "Guide de référence pour l'IA sur Adastra (AMD MI300A / MI250X) — CINES"
site_author = "CINES"
site_url = "https://emile-salaun.github.io/cines.ai-handbook/fr/"
repo_url = "https://github.com/emile-salaun/cines.ai-handbook"
repo_name = "cines.ai-handbook"
edit_uri = "edit/main/docs/fr/"
docs_dir = "docs/fr"
site_dir = "site/fr"
copyright = "Copyright &copy; 2026 CINES — Apache License 2.0"
extra_css = ["stylesheets/cines.css"]

nav = [
  { "Accueil" = "index.md" },
  { "1 · Prise en main" = [
    "getting-started/index.md",
    { "Adastra en bref" = "getting-started/adastra.md" },
    { "Configurer votre environnement" = "getting-started/setup.md" },
    { "Premier job" = "getting-started/first-job.md" },
    { "Modèles de jobs" = "getting-started/templates.md" },
    { "Session interactive" = "getting-started/interactive.md" },
    { "Vérifications GPU et communications" = "getting-started/checks.md" },
  ] },
  { "2 · Données et modèles" = "data-models/index.md" },
  { "3 · Inférence" = "inference/index.md" },
  { "4 · Entraînement et fine-tuning" = "training/index.md" },
  { "5 · Profilage" = "profiling/index.md" },
  { "A · Annexes" = [
    "appendices/index.md",
    { "Construire votre propre environnement (uv)" = "appendices/own-env.md" },
  ] },
]

[project.theme]
language = "fr"
custom_dir = "overrides"
logo = "assets/logo/cines-logo-inverse.svg"
favicon = "assets/logo/favicon.svg"
font = false          # CINES fonts, self-hosted (overrides/stylesheets/cines.css)
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",          # linked tabs (MI300A / MI250X)
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Passer en mode sombre"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Passer en mode clair"

[project.theme.icon]
repo = "fontawesome/brands/github"

# Language selector (absolute links: the site_url domain is prepended)
[project.extra]
alternate = [
  { name = "English", link = "/cines.ai-handbook/", lang = "en" },
  { name = "Français", link = "/cines.ai-handbook/fr/", lang = "fr" },
]

[[project.extra.social]]
icon = "fontawesome/solid/book"
link = "https://dci.dci-gitlab.cines.fr/webextranet/"
name = "Documentation Adastra"

[[project.extra.social]]
icon = "fontawesome/solid/globe"
link = "https://www.cines.fr/"
name = "CINES"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/emile-salaun/cines.ai-handbook"
name = "Dépôt du handbook"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true