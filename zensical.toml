# =============================================================================
# cines.ai - Handbook — English site (default)
#   French version: zensical.fr.toml, built AFTERWARDS into site/fr/
#   (this build wipes site/).
#   Local preview:  zensical serve
#   Both files share everything except [project] paths, the language and the
#   UI labels: keep the rest in sync.
# =============================================================================

[project]
site_name = "cines.ai - Handbook"
site_description = "Reference guide for AI on Adastra (AMD MI300A / MI250X) — CINES"
site_author = "CINES"
site_url = "https://emile-salaun.github.io/cines.ai-handbook/"
repo_url = "https://github.com/emile-salaun/cines.ai-handbook"
repo_name = "cines.ai-handbook"
edit_uri = "edit/main/docs/en/"
docs_dir = "docs/en"
site_dir = "site"
copyright = "Copyright &copy; 2026 CINES — Apache License 2.0"
extra_css = ["stylesheets/cines.css"]

nav = [
  { "Home" = "index.md" },
  { "1 · Getting started" = [
    "getting-started/index.md",
    { "Adastra at a glance" = "getting-started/adastra.md" },
    { "Set up" = "getting-started/setup.md" },
    { "First job" = "getting-started/first-job.md" },
    { "Job templates" = "getting-started/templates.md" },
    { "Interactive session" = "getting-started/interactive.md" },
    { "GPU and communication checks" = "getting-started/checks.md" },
  ] },
  { "2 · Data & models" = "data-models/index.md" },
  { "3 · Inference" = "inference/index.md" },
  { "4 · Training & fine-tuning" = "training/index.md" },
  { "5 · Scaling out" = "scaling/index.md" },
  { "6 · Performance & profiling" = "performance/index.md" },
  { "7 · HPC workflows" = "workflows/index.md" },
  { "A · Appendices" = "appendices/index.md" },
]

[project.theme]
language = "en"
custom_dir = "overrides"
logo = "assets/logo/cines-logo-inverse.svg"
favicon = "assets/logo/favicon.svg"
font = false          # CINES fonts, self-hosted (overrides/stylesheets/cines.css)
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",          # linked tabs (MI300A / MI250X)
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

# Language selector (absolute links: the site_url domain is prepended)
[project.extra]
alternate = [
  { name = "English", link = "/cines.ai-handbook/", lang = "en" },
  { name = "Français", link = "/cines.ai-handbook/fr/", lang = "fr" },
]

[[project.extra.social]]
icon = "fontawesome/solid/globe"
link = "https://www.cines.fr/"
name = "CINES"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/emile-salaun/cines.ai-handbook"
name = "Handbook repository"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
