# pyproject.toml - The handbook's uv environment (not a Python package). Exact
# versions: uv.lock. Same wheels for MI300A and MI250X.
# Usage (login node, repository root): module load python && uv sync --locked [--group <name>]
#   each uv sync installs the base and only the groups it names.
# Maintainers: after a change, uv lock, test on MI300A and MI250X, commit uv.lock.
# Ref: https://docs.astral.sh/uv/guides/integration/pytorch/
[project]
name = "cines-ai-handbook"
version = "0.1.0"
description = "uv environment of the cines.ai handbook (Adastra, CINES)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.11.0",
    # ROCm support relies on both Triton packages, from the PyTorch index.
    "pytorch-triton-rocm>=3.5.1 ; sys_platform == 'linux'",
    "triton-rocm>=3.6.0 ; sys_platform == 'linux'",
    "transformers>=4.57",
    "huggingface_hub>=0.34",        # provides the `hf` command
    "datasets>=3.0",                # chapter 2: datasets loaded by path, offline
]

[dependency-groups]
# Frameworks
accelerate = ["accelerate"]
peft = [{ include-group = "accelerate" }, "peft"]
deepspeed = ["deepspeed"]           # ops compiled at first use (needs the ROCm compilers)
diffusers = ["diffusers"]
# Chapters
inference = [{ include-group = "accelerate" }, { include-group = "diffusers" }]
training = [{ include-group = "peft" }, { include-group = "deepspeed" }]
profiling = ["tensorboard"]

[tool.uv]
package = false
# Oldest uv accepted: align with the uv of `module load python` on Adastra.
required-version = ">=0.8"
# Adastra only: Linux x86_64.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-rocm" }]
pytorch-triton-rocm = [{ index = "pytorch-rocm" }]
triton-rocm = [{ index = "pytorch-rocm" }]